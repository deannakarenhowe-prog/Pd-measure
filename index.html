<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PD Measure</title>

<style>
body{
font-family:Arial,sans-serif;
background:#f4f6fa;
margin:0;
padding:20px;
text-align:center;
color:#172033
}

.card{
background:white;
border-radius:22px;
padding:22px;
max-width:500px;
margin:auto;
box-shadow:0 5px 25px #0001
}

h1{font-size:29px}
p{color:#667085;line-height:1.5}

button{
width:100%;
padding:16px;
margin-top:14px;
border:0;
border-radius:14px;
background:#1769ff;
color:white;
font-size:17px;
font-weight:bold
}

video{
width:100%;
margin-top:18px;
border-radius:18px;
background:#111
}

.hidden{display:none}

.guide{
margin-top:15px;
padding:15px;
background:#eef4ff;
border-radius:14px;
text-align:left
}

.result{
font-size:42px;
font-weight:bold;
margin:20px 0
}
</style>
</head>

<body>

<div class="card">

<h1>PD Measure</h1>

<p>
Measure your pupil distance using your phone camera.
</p>

<div class="guide">
<b>Before you start</b><br><br>
You will need a normal bank or credit card.
Hold the card flat beside your face so the app has a known-size reference.
</div>

<button onclick="startCamera()">
Start measurement
</button>

<video id="camera" class="hidden" autoplay playsinline></video>

<button id="capture" class="hidden" onclick="capturePhoto()">
Take photo
</button>

<div id="message"></div>

</div>

<script>

let video=document.getElementById("camera");
let stream;

async function startCamera(){

try{

stream=await navigator.mediaDevices.getUserMedia({
video:{
facingMode:"user"
},
audio:false
});

video.srcObject=stream;

video.classList.remove("hidden");

document.getElementById("capture")
.classList.remove("hidden");

document.getElementById("message").innerHTML=
"<p>Look straight at the camera. Keep your head still and make sure both eyes and the reference card are visible.</p>";

}catch(error){

document.getElementById("message").innerHTML=
"<p><b>Camera access was not allowed.</b><br>Please allow camera access and try again.</p>";

}

}

function capturePhoto(){

document.getElementById("message").innerHTML=
"<div class='result'>Photo captured ✓</div><p>Photo received. The pupil-detection and calibration engine will be added next.</p>";

}

</script>

</body>
</html>
